
name: VPS-Checker Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-checker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and test
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "=== Node.js környezet ==="
            export NVM_DIR="/root/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm use 22 >/dev/null

            echo "=== Git frissítés ==="
            cd /root/VPS-Checker
            git checkout main
            git pull --ff-only origin main

            echo "=== Backend build ==="
            cd backend
            test -s .env
            npm ci
            npm run typecheck
            npm test
            npm run build

            echo "=== PM2 újraindítás ==="
            pm2 restart vps-checker-backend --update-env
            pm2 save

            echo "=== API ellenőrzés ==="
            sleep 2

            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 5 \
              http://127.0.0.1:5002/api/monitors)

            if [ "$HTTP_CODE" != "401" ]; then
              echo "Unexpected API response: $HTTP_CODE"
              exit 1
            fi

            echo "=== Deployment successful ==="
