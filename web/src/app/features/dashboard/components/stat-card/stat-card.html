<article
  class="group h-full rounded-2xl border border-slate-800/90 bg-slate-900/65 p-5 shadow-xl shadow-black/5 backdrop-blur transition duration-300 hover:-translate-y-0.5 hover:border-slate-700 hover:bg-slate-900"
>
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-sm font-medium text-slate-400">{{ title() }}</p>
      <p class="mt-3 text-3xl font-semibold tracking-tight text-white">{{ value() }}</p>
    </div>
    <div class="rounded-xl border p-2.5" [class]="accentClasses()">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8">
        @switch (icon()) {
          @case ('online') {
            <path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
          }
          @case ('warning') {
            <path
              d="M12 9v4m0 4h.01M10.3 4.6 2.8 18a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0Z"
              stroke-linecap="round"
            />
          }
          @case ('offline') {
            <path
              d="m8 8 8 8m0-8-8 8M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"
              stroke-linecap="round"
            />
          }
          @case ('uptime') {
            <path d="M3 12h4l2-6 4 12 2-6h6" stroke-linecap="round" stroke-linejoin="round" />
          }
          @case ('latency') {
            <path d="M4 14a8 8 0 1 1 16 0M12 14l4-4" stroke-linecap="round" />
          }
          @case ('incident') {
            <path
              d="M12 2v10m0 4v.01M4.9 19.1a10 10 0 1 1 14.2 0 10 10 0 0 1-14.2 0Z"
              stroke-linecap="round"
            />
          }
          @default {
            <rect x="4" y="3" width="16" height="7" rx="2" />
            <rect x="4" y="14" width="16" height="7" rx="2" />
            <path d="M8 6.5h.01M8 17.5h.01" stroke-linecap="round" />
          }
        }
      </svg>
    </div>
  </div>
  @if (description()) {
    <p class="mt-3 text-xs leading-relaxed text-slate-500">{{ description() }}</p>
  }
</article>
