<article
  class="rounded-2xl border border-slate-800/90 bg-slate-900/70 p-5 shadow-2xl shadow-black/10"
>
  <header class="mb-5 flex items-start justify-between gap-4">
    <div>
      <h3 class="font-semibold text-slate-100">{{ title() }}</h3>
    </div>
    @if (average() !== null) {
      <div class="text-right text-xs text-slate-500">
        <div>
          Átlag <span class="font-mono text-slate-300">{{ average() }} {{ unit() }}</span>
        </div>
        <div>
          Max <span class="font-mono text-slate-300">{{ maximum() }} {{ unit() }}</span>
        </div>
      </div>
    }
  </header>

  @if (svgPoints().length > 0) {
    <div class="overflow-hidden rounded-xl border border-slate-800 bg-slate-950/70">
      <svg viewBox="0 0 800 220" class="h-52 w-full" role="img" [attr.aria-label]="title()">
        <line x1="24" y1="32" x2="776" y2="32" stroke="#1e293b" stroke-width="1" />
        <line x1="24" y1="114" x2="776" y2="114" stroke="#1e293b" stroke-width="1" />
        <line x1="24" y1="196" x2="776" y2="196" stroke="#334155" stroke-width="1" />
        <polyline
          fill="none"
          [attr.stroke]="strokeColor()"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          [attr.points]="polyline()"
        />
        @for (point of svgPoints(); track point.timestamp) {
          <circle
            [attr.cx]="point.x"
            [attr.cy]="point.y"
            r="4"
            [attr.fill]="strokeColor()"
            stroke="#020617"
            stroke-width="2"
            tabindex="0"
          >
            <title>{{ formatTime(point.timestamp) }} · {{ point.value }} {{ unit() }}</title>
          </circle>
        }
      </svg>
    </div>
    <div class="mt-2 flex justify-between text-[11px] text-slate-600">
      <span>{{ formatTime(points()[0]!.timestamp) }}</span>
      <span>{{ formatTime(points()[points().length - 1]!.timestamp) }}</span>
    </div>
  } @else {
    <div
      class="flex h-52 items-center justify-center rounded-xl border border-dashed border-slate-700 bg-slate-950/30 text-sm text-slate-500"
    >
      Nincs mérési adat a kiválasztott időszakban
    </div>
  }
</article>
